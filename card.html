<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Kelsey T. — LNL Solutions LLC</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --card: #111111;
  --card-inner: #161616;
  --gold: #c9962a;
  --gold2: #e0ac3f;
  --gold3: #f0c76a;
  --white: #ffffff;
  --soft: #d4d8e0;
  --muted: #888888;
  --muted2: #555555;
  --border: rgba(255,255,255,0.1);
  --border-gold: rgba(201,150,42,0.3);
  --bebas: 'Bebas Neue', sans-serif;
  --sans: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }

body {
min-height: 100vh;
background: var(–bg);
display: flex;
align-items: center;
justify-content: center;
padding: 28px 20px;
font-family: var(–sans);
position: relative;
}

/* Subtle radial glow */
body::before {
content: ‘’;
position: fixed;
inset: 0;
background: radial-gradient(ellipse 90% 60% at 50% 0%, rgba(201,150,42,0.1) 0%, transparent 65%);
pointer-events: none;
}

/* CARD WRAPPER */
.card {
width: 100%;
max-width: 380px;
background: var(–card);
border: 1px solid rgba(201,150,42,0.2);
border-radius: 12px;
overflow: hidden;
position: relative;
animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) both;
box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 24px 60px rgba(0,0,0,0.8), 0 0 80px rgba(201,150,42,0.04);
}

@keyframes rise {
from { opacity: 0; transform: translateY(30px) scale(0.97); }
to { opacity: 1; transform: translateY(0) scale(1); }
}

/* TOP GOLD BAR */
.gold-bar {
height: 3px;
background: linear-gradient(90deg, transparent 0%, var(–gold) 20%, var(–gold3) 50%, var(–gold) 80%, transparent 100%);
}

/* HEADER SECTION */
.card-header {
padding: 32px 32px 28px;
background: linear-gradient(160deg, #1a1612 0%, #111111 60%);
border-bottom: 1px solid var(–border);
position: relative;
overflow: hidden;
}

/* Subtle corner accent */
.card-header::after {
content: ‘’;
position: absolute;
top: -40px; right: -40px;
width: 140px; height: 140px;
background: radial-gradient(circle, rgba(201,150,42,0.08) 0%, transparent 70%);
}

.top-row {
display: flex;
align-items: flex-start;
justify-content: space-between;
margin-bottom: 28px;
}

.company-block { display: flex; flex-direction: column; gap: 3px; }

.company-name {
font-family: var(–bebas);
font-size: 22px;
letter-spacing: 3px;
color: var(–white);
line-height: 1;
}

.company-type {
font-family: var(–mono);
font-size: 8px;
color: var(–gold2);
letter-spacing: 2.5px;
text-transform: uppercase;
}

.az-pill {
background: rgba(201,150,42,0.12);
border: 1px solid var(–border-gold);
border-radius: 20px;
padding: 4px 12px;
font-family: var(–mono);
font-size: 8px;
color: var(–gold2);
letter-spacing: 2px;
white-space: nowrap;
}

.person-name {
font-family: var(–bebas);
font-size: 56px;
letter-spacing: 2px;
color: var(–white);
line-height: 0.9;
margin-bottom: 10px;
}

.person-title {
display: inline-flex;
align-items: center;
gap: 8px;
font-family: var(–mono);
font-size: 9px;
color: var(–gold2);
letter-spacing: 2px;
text-transform: uppercase;
}

.person-title::before {
content: ‘’;
display: block;
width: 18px;
height: 1px;
background: var(–gold2);
}

/* CONTACT SECTION */
.card-body { padding: 8px 0; }

.contact-row {
display: flex;
align-items: center;
gap: 16px;
padding: 16px 32px;
text-decoration: none;
border-bottom: 1px solid rgba(255,255,255,0.05);
transition: all 0.2s;
cursor: pointer;
position: relative;
}

.contact-row:last-child { border-bottom: none; }

.contact-row::before {
content: ‘’;
position: absolute;
left: 0; top: 0; bottom: 0;
width: 2px;
background: var(–gold);
opacity: 0;
transition: opacity 0.2s;
}

.contact-row:hover { background: rgba(255,255,255,0.03); }
.contact-row:hover::before { opacity: 1; }
.contact-row:active { background: rgba(201,150,42,0.06); }

.icon-wrap {
width: 38px;
height: 38px;
background: rgba(255,255,255,0.06);
border: 1px solid var(–border);
border-radius: 8px;
display: flex;
align-items: center;
justify-content: center;
font-size: 16px;
flex-shrink: 0;
transition: all 0.2s;
}

.contact-row:hover .icon-wrap {
background: rgba(201,150,42,0.1);
border-color: var(–border-gold);
}

.contact-text { flex: 1; }

.contact-label {
font-family: var(–mono);
font-size: 8px;
color: var(–muted);
letter-spacing: 1.5px;
text-transform: uppercase;
margin-bottom: 3px;
}

.contact-val {
font-family: var(–sans);
font-size: 14px;
font-weight: 500;
color: var(–soft);
line-height: 1.2;
}

.contact-chevron {
color: var(–muted2);
font-size: 14px;
transition: all 0.2s;
flex-shrink: 0;
}

.contact-row:hover .contact-chevron {
color: var(–gold2);
transform: translateX(3px);
}

/* QR */
.qr-section {
padding: 24px 32px;
background: var(–card-inner);
border-top: 1px solid var(–border);
display: flex;
align-items: center;
gap: 20px;
}

.qr-wrap {
width: 80px;
height: 80px;
background: var(–white);
border-radius: 6px;
padding: 6px;
flex-shrink: 0;
}

.qr-wrap canvas { width: 100% !important; height: 100% !important; }

.qr-text { flex: 1; }

.qr-label {
font-family: var(–mono);
font-size: 8px;
color: var(–muted);
letter-spacing: 2px;
text-transform: uppercase;
margin-bottom: 6px;
}

.qr-url {
font-family: var(–mono);
font-size: 10px;
color: var(–gold2);
word-break: break-all;
line-height: 1.5;
}

/* SAVE BUTTON */
.card-footer { padding: 20px 32px 28px; }

.save-btn {
width: 100%;
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
background: linear-gradient(135deg, var(–gold), var(–gold2));
color: #000;
padding: 16px;
border-radius: 8px;
font-family: var(–sans);
font-size: 14px;
font-weight: 700;
letter-spacing: 0.5px;
border: none;
cursor: pointer;
transition: all 0.25s;
margin-bottom: 10px;
box-shadow: 0 4px 20px rgba(201,150,42,0.25);
}

.save-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(201,150,42,0.35); }
.save-btn:active { transform: scale(0.98); }

.web-btn {
width: 100%;
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
background: transparent;
color: var(–muted);
padding: 14px;
border-radius: 8px;
font-family: var(–mono);
font-size: 10px;
letter-spacing: 1.5px;
text-transform: uppercase;
text-decoration: none;
border: 1px solid var(–border);
transition: all 0.2s;
}

.web-btn:hover { color: var(–white); border-color: rgba(255,255,255,0.2); }

/* TOAST */
.toast {
position: fixed;
bottom: 32px;
left: 50%;
transform: translateX(-50%) translateY(80px);
background: linear-gradient(135deg, var(–gold), var(–gold2));
color: #000;
padding: 13px 28px;
border-radius: 50px;
font-family: var(–sans);
font-size: 13px;
font-weight: 700;
transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
z-index: 999;
white-space: nowrap;
box-shadow: 0 8px 24px rgba(201,150,42,0.4);
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>

</head>
<body>

<div class="card">
  <div class="gold-bar"></div>

  <div class="card-header">
    <div class="top-row">
      <div class="company-block">
        <div class="company-name">LNL SOLUTIONS</div>
        <div class="company-type">AI Integration Company</div>
      </div>
      <div class="az-pill">AZ LLC</div>
    </div>
    <div class="person-name">KELSEY T.</div>
    <div class="person-title">AI Integration & Lead Generation</div>
  </div>

  <div class="card-body">
    <a class="contact-row" href="tel:4802742363">
      <div class="icon-wrap">📞</div>
      <div class="contact-text">
        <div class="contact-label">Phone</div>
        <div class="contact-val">(480) 274-2363</div>
      </div>
      <div class="contact-chevron">›</div>
    </a>
    <a class="contact-row" href="mailto:lnlsolutions@proton.me">
      <div class="icon-wrap">✉️</div>
      <div class="contact-text">
        <div class="contact-label">Email</div>
        <div class="contact-val">lnlsolutions@proton.me</div>
      </div>
      <div class="contact-chevron">›</div>
    </a>
    <a class="contact-row" href="https://lnlsolutionsllc.netlify.app" target="_blank">
      <div class="icon-wrap">🌐</div>
      <div class="contact-text">
        <div class="contact-label">Website</div>
        <div class="contact-val">lnlsolutionsllc.netlify.app</div>
      </div>
      <div class="contact-chevron">›</div>
    </a>
  </div>

  <div class="qr-section">
    <div class="qr-wrap"><canvas id="qr"></canvas></div>
    <div class="qr-text">
      <div class="qr-label">Scan to visit</div>
      <div class="qr-url">lnlsolutionsllc.netlify.app/card.html</div>
    </div>
  </div>

  <div class="card-footer">
    <button class="save-btn" onclick="saveContact()">＋ Save Contact</button>
    <a class="web-btn" href="https://lnlsolutionsllc.netlify.app" target="_blank">Visit Our Website →</a>
  </div>
</div>

<div class="toast" id="toast">✓ Contact saved!</div>

<script>
// QR pattern
(function() {
  const canvas = document.getElementById('qr');
  const ctx = canvas.getContext('2d');
  const s = 68;
  canvas.width = s; canvas.height = s;
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, s, s);
  ctx.fillStyle = '#000';

  function finder(x, y) {
    ctx.fillStyle = '#000';
    ctx.fillRect(x, y, 19, 19);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x+2, y+2, 15, 15);
    ctx.fillStyle = '#000';
    ctx.fillRect(x+5, y+5, 9, 9);
  }
  finder(0, 0);
  finder(s-19, 0);
  finder(0, s-19);

  const str = 'lnlsolutionsllc.netlify.app';
  ctx.fillStyle = '#000';
  for(let r = 3; r < 11; r++) {
    for(let c = 3; c < 11; c++) {
      const code = str.charCodeAt((r*7+c) % str.length);
      if((code ^ (r*3) ^ (c*5)) % 2 === 0) {
        ctx.fillRect(c*6+2, r*6+2, 5, 5);
      }
    }
  }
})();

// Save vCard
function saveContact() {
  const v = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'FN:Kelsey T.',
    'ORG:LNL Solutions LLC',
    'TITLE:AI Integration & Lead Generation',
    'TEL;TYPE=CELL:+14802742363',
    'EMAIL:lnlsolutions@proton.me',
    'URL:https://lnlsolutionsllc.netlify.app',
    'NOTE:AI Integration Company - Arizona LLC',
    'END:VCARD'
  ].join('\r\n');

  const blob = new Blob([v], { type: 'text/vcard;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Kelsey-LNL-Solutions.vcf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}
</script>

</body>
</html>
